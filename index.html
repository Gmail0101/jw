<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>달력 스케줄러</title>
<link rel="stylesheet" href="style.css">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>
<div id="authScreen" class="auth-screen">
  <div class="auth-card">
    <h1>달력 스케줄러</h1>
    <p>로그인 후 일정을 관리하세요.</p>

    <div id="authMessage" class="auth-message"></div>

    <form id="loginForm">
      <label>아이디
        <input type="text" id="loginUsername" required autocomplete="username" placeholder="아이디">
      </label>
      <label>비밀번호
        <input type="password" id="loginPassword" required autocomplete="current-password" placeholder="비밀번호">
      </label>
      <button class="primary-btn" type="submit">로그인</button>
    </form>

    <div class="auth-divider">처음 사용하는 경우</div>

    <form id="signupForm">
      <label>아이디
        <input type="text" id="signupUsername" required minlength="3" maxlength="30" pattern="[A-Za-z0-9._-]+" autocomplete="username" placeholder="영문, 숫자, ., _, -">
      </label>
      <label>이름
        <input type="text" id="signupName" required maxlength="50" autocomplete="name" placeholder="이름">
      </label>
      <label>비밀번호
        <input type="password" id="signupPassword" minlength="6" required autocomplete="new-password" placeholder="6자 이상">
      </label>
      <label>비밀번호 확인
        <input type="password" id="signupPasswordConfirm" minlength="6" required autocomplete="new-password" placeholder="비밀번호 다시 입력">
      </label>
      <button class="secondary-btn full" type="submit">회원가입</button>
    </form>
  </div>
</div>

<div id="appScreen" class="app hidden">
  <header class="topbar">
    <div>
      <h1>달력 스케줄러</h1>
      <p id="userInfo">로그인 사용자</p>
    </div>
    <div class="top-actions">
      <span id="roleBadge" class="role-badge"></span>
      <button id="logoutBtn" class="secondary-btn">로그아웃</button>
    </div>
  </header>

  <main>
    <section class="calendar-card">
      <div class="calendar-head">
        <button id="prevMonth">‹</button>
        <h2 id="monthTitle"></h2>
        <button id="nextMonth">›</button>
        <button id="todayBtn" class="today-btn">오늘</button>
      </div>
      <div class="weekdays"><div>일</div><div>월</div><div>화</div><div>수</div><div>목</div><div>금</div><div>토</div></div>
      <div id="calendar" class="calendar"></div>
    </section>

    <section id="memberAdminCard" class="schedule-card hidden">
      <div class="section-head">
        <div>
          <h2>회원 관리</h2>
          <p id="memberCount">가입 회원</p>
        </div>
        <button id="refreshMembersBtn" class="secondary-btn" type="button">새로고침</button>
      </div>
      <div id="memberList" class="member-list"></div>
    </section>

    <section class="schedule-card">
      <div class="section-head">
        <div>
          <h2 id="selectedDateTitle">일정</h2>
          <p id="scheduleCount">등록된 일정 0개</p>
        </div>
        <button id="addScheduleBtn" class="primary-btn">+ 일정 등록</button>
      </div>

      <div class="filters">
        <button class="filter active" data-category="all">전체</button>
        <button class="filter" data-category="CPF 지원">CPF 지원</button>
        <button class="filter" data-category="차량사고">차량사고</button>
        <button class="filter" data-category="이슈">이슈</button>
      </div>
      <div id="scheduleList" class="schedule-list"></div>
    </section>
  </main>
</div>

<div id="modal" class="modal hidden">
  <div class="modal-backdrop"></div>
  <div class="modal-box">
    <div class="modal-head">
      <h2 id="modalTitle">일정 등록</h2>
      <button id="closeModal" class="icon-btn">×</button>
    </div>
    <form id="scheduleForm">
      <input type="hidden" id="scheduleId">
      <label>날짜<input type="date" id="scheduleDate" required></label>
      <label>제목<input type="text" id="scheduleTitle" required></label>
      <div class="two-col">
        <div class="category-field">
          <label>카테고리</label>
          <input type="hidden" id="scheduleCategory" value="CPF 지원">
          <div id="categoryOptions" class="category-options" role="radiogroup" aria-label="카테고리">
            <button type="button" class="category-option cpf active" data-category="CPF 지원" role="radio" aria-checked="true">CPF 지원</button>
            <button type="button" class="category-option accident" data-category="차량사고" role="radio" aria-checked="false">차량사고</button>
            <button type="button" class="category-option issue" data-category="이슈" role="radio" aria-checked="false">이슈</button>
          </div>
        </div>
        <label>시작 시간<input type="time" id="startTime"></label>
      </div>
      <div class="two-col">
        <label>종료 시간<input type="time" id="endTime"></label>
        <label>이미지<input type="file" id="scheduleImages" accept="image/*" multiple></label>
      </div>
      <label>내용<textarea id="scheduleDescription" rows="5"></textarea></label>
      <div id="imagePreview" class="image-preview"></div>
      <div class="form-actions">
        <button type="button" id="cancelBtn" class="secondary-btn">취소</button>
        <button type="submit" class="primary-btn">저장</button>
      </div>
    </form>
  </div>
</div>

<script src="app.js"></script>
</body>
</html>
